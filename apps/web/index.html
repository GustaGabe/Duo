<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Duo — o dinheiro de vocês dois, no mesmo lugar." />
    <meta name="theme-color" content="#1B1FE5" />
    <title>Duo — finanças a dois</title>
    <script>
      // Apply the theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem('duo-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
